env:
  contexts:
    - name: thesisflow-local-autorizado
      urls:
        - http://192.168.65.254:5173
        - http://192.168.65.254:8000
        - http://192.168.65.254:9099
      excludePaths: []
  parameters:
    failOnError: true
    progressToStdout: true

jobs:
  - type: passiveScan-config
    parameters:
      enableTags: false
      maxAlertsPerRule: 0

  - type: openapi
    parameters:
      apiUrl: http://192.168.65.254:8000/openapi.json
      targetUrl: http://192.168.65.254:8000

  - type: spider
    parameters:
      context: thesisflow-local-autorizado
      url: http://192.168.65.254:5173
      maxDuration: 2

  - type: passiveScan-wait
    parameters:
      maxDuration: 10

  - type: report
    parameters:
      template: traditional-html
      reportDir: /zap/wrk/
      reportFile: relatorio-zap.html
      reportTitle: ThesisFlow - Etapa 5 - Sessao ZAP
      reportDescription: Sessao local autorizada, com Firebase Authentication e Firestore emulados.

  - type: report
    parameters:
      template: traditional-json
      reportDir: /zap/wrk/
      reportFile: relatorio-zap.json
      reportTitle: ThesisFlow - Etapa 5 - Sessao ZAP
      reportDescription: Sessao local autorizada, com Firebase Authentication e Firestore emulados.
